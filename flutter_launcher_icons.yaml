# flutter_launcher_icons configuration
# Auto-generated from .env LAUNCHER_ICON
# Do not edit manually - run: dart run tool/generate_launcher_icons.dart
#
# update icon:
#   flutter clean
#   flutter pub get
#   flutter pub run flutter_launcher_icons

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true

  image_path: "assets/images/logo/logo_gold.png"

  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/images/logo/logo_gold.png"
